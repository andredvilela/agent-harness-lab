[lab]
runs_dir = "runs"
repo_root = "."

[agent]
max_turns = 10

[debug]
llm_trace = "off"

[models.openai_luna]
provider = "openai"
model = "gpt-5.6-luna"
max_output_tokens = 4096

[models.openai_sol]
provider = "openai"
model = "gpt-5.6-sol"
max_output_tokens = 4096

[models.anthropic_haiku]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
max_output_tokens = 4096

[models.anthropic_opus]
provider = "anthropic"
model = "claude-opus-5"
max_output_tokens = 4096
